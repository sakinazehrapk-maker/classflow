<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ClassFlow</h1>
        <p>Your Class Companion</p>
    </header>
    <main>
        <section class="timetable">
            <div class="toolbar">
                <button id="openModal">+ Add Class</button>
            </div>
            <h2>Weekly Timetable</h2>
            <div id="timetableGrid"></div>
        </section>
        <aside class="widget">
            <h3>Current Class</h3>
            <p>No class right now</p>
            <hr>
            <p>Next: --</p>
            <p>Time Left: --</p>
        </aside>
    </main>
    <div class="modal" id="modal">
    <div class="modal-content">
        <h2>Add Class</h2>
        <input
            type="text"
            id="course"
            placeholder="Course Name">
        <select id="day">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
        </select>
        <input type="time" id="start">
        <input type="time" id="end">
        <input
            type="text"
            id="room"
            placeholder="Room">
        <div class="buttons">
            <button id="saveClass">
                Save
            </button>
            <button id="closeModal">
                Cancel
            </button>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
