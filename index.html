<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <div class="header-content">
        <div>
            <h1>ClassFlow</h1>
            <p>Your Class Companion</p>
            <div id="greeting"></div>
        </div>
        <button id="themeToggle">🌙</button>
    </div>
    <nav>
    <button id="showTimetable">
        📅 Timetable
    </button>
    <button id="showAttendance">
        ✅ Attendance
    </button>
    <button id="showAssignments">
    Assignments
    </button>
</nav>
</header>
    <main>
        <section id="timetablePage" class="page">
        <section class="timetable">
            <div class="toolbar">
                <button id="openModal">+ Add Class</button>
            </div>
            <div class="today-panel">
                <h2>Today's Schedule</h2>
                <div id="todayClasses"></div>
            </div>
            <h2>Weekly Timetable</h2>
            <div class="schedule">
            <div class="time-column" id="timeColumn"></div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
        </section>
        <aside class="widget">
    <div class="widget-header"></div>
    <h3>Current Class</h3>
    <span id="liveTime"></span>
    <h2 id="currentCourse">No Class</h2>
    <p id="currentRoom">--</p>
    <p id="currentTime">--</p>
    <div class="progress-bar">
        <div id="progress"></div>
    </div>
    <p id="timeRemaining">
        Time Left: --
    </p>
    <hr>
    <div class="next-class">
        <small>Next Class</small>
        <h4 id="nextClass">--</h4>
        <p id="nextTime"></p>
    </div>
    </aside>
</section>
<section id="attendancePage" class="page hidden">
    <h2>Attendance Tracker</h2>
    <div id="attendanceContainer"></div>
</section>
<section id="assignmentsPage" class="page hidden">
    <div class="page-header assignment-header"></div>
        <h2>Assignments</h2>
        <button id="openAssignmentModal">
            + Add Assignment
        </button>
    </div>
    <div id="assignmentContainer">
    <p id="noAssignments">
        No assignments yet 
    </p>
</div>
</section>
    </main>
    <div class="modal" id="modal">
    <div class="modal-content">
        <h2>Add Class</h2>
        <input
            type="text"
            id="course"
            placeholder="Course Name">
        <input
            type="text"
            id="room"
            placeholder="Room Number">
        <label>Subject Color</label>
        <input type="color"
        id="color" value="#2563eb">
        <select id="day">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
        </select>
        <div class="time-row">
            <input
                type="time"
                id="start">
            <input
                type="time"
                id="end">
        </div>
        <div class="buttons">
            <button id="closeModal">
                Cancel
            </button>
            <button id="saveClass">
                Save Class
            </button>
        </div>
    </div>
</div>
<div class="modal" id="assignmentModal">
    <div class="modal-content">
        <h2>Add Assignment</h2>
        <input
            id="assignmentTitle"
            type="text"
            placeholder="Assignment Name"
            required>
        <select id="assignmentSubject">
    <option disabled selected>
        Select Subject
    </option>
</select>
        <label>
            Due Date
        </label>
        <input
        id="assignmentDate"
        type="date">
        <select id="assignmentPriority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>
        <select id="assignmentStatus">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Completed</option>
        </select>
        <div class="buttons">
            <button id="closeAssignmentModal">
                Cancel
            </button>
            <button id="saveAssignment">
                Save
            </button>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
