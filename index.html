<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ClassFlow</h1>
    <p>Your Timetable Assistant</p>
  </header>
  <main>
    <section class="timetable">
      <section class="timetable">
  <h2>Weekly Timetable</h2>
  <div class="add-class-form">
    <input
        type="text"
        id="course"
        placeholder="Course Name">
    <select id="day">
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
    </select>
    <input type="time" id="startTime">
    <input type="time" id="endTime">
    <input
        type="text"
        id="room"
        placeholder="Room">
    <button id="addClass">
        Add Class
    </button>
</div>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>8:00 - 9:00</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td>9:00 - 10:00</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td>10:00 - 11:00</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td>11:00 - 12:00</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </tbody>
  </table>
</section>
    </section>
    <aside class="floating-box">
      <h3>Current Class</h3>
      <p><strong>None</strong></p>
      <hr>
      <p>Time Left: --</p>
      <p>Next Class: --</p>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
