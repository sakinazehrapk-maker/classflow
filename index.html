<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ClassFlow</h1>
    <p>Your Timetable Assistant</p>
  </header>
  <main>
    <section class="timetable">
      <h2>Weekly Timetable</h2>
      <p>Your classes will appear here.</p>
    </section>
    <aside class="floating-box">
      <h3>Current Class</h3>
      <p><strong>None</strong></p>
      <hr>
      <p>Time Left: --</p>
      <p>Next Class: --</p>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
